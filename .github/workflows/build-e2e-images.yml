# Builds and publishes the e2e test environment images to ghcr.io.
# These layer npm + Playwright on top of felddy/foundryvtt so CI and local
# container runs skip the expensive apt bootstrap on every test invocation.
#
# Images: ghcr.io/daxiongmao87/simulacrum-foundry/e2e:13
#         ghcr.io/daxiongmao87/simulacrum-foundry/e2e:14
#
# Trigger: push to main that touches the Dockerfile, or manual dispatch.

name: Build E2E Images

'on':
  push:
    branches: [main]
    paths:
      - tests/e2e/docker/Dockerfile
  workflow_dispatch:
    inputs:
      foundry_tag:
        description: 'Foundry tag to build (leave blank to build all)'
        required: false
        default: ''

jobs:
  build:
    name: Build ${{ matrix.foundry_tag }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        foundry_tag: ['13', '14']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: tests/e2e/docker
          file: tests/e2e/docker/Dockerfile
          build-args: |
            FOUNDRY_TAG=${{ matrix.foundry_tag }}
          push: true
          tags: ghcr.io/daxiongmao87/simulacrum-foundry/e2e:${{ matrix.foundry_tag }}
          cache-from: type=gha,scope=e2e-${{ matrix.foundry_tag }}
          cache-to: type=gha,mode=max,scope=e2e-${{ matrix.foundry_tag }}
